services:
  - type: web
    name: fahrzeug-tracking
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn hauptprogramm:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DISPONENT_USER
        sync: false
      - key: DISPONENT_PASS
        sync: false
